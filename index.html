<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For You ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="overlay"></div>
<canvas id="confetti"></canvas>

<!-- SCREEN 1 -->
<div class="screen active" id="screen1">
  <h1 class="glow">Hey Ammuuuu ❤️</h1>
  <button onclick="startExperience()">Start 💖</button>
</div>

<!-- SCREEN 2 -->
<div class="screen" id="screen2">
  <h1 id="typing"></h1>
  <button class="nextBtn" onclick="goNext(event)">Next →</button>
</div>

<!-- SCREEN 3 -->
<div class="screen" id="screen3">
  <h2>Our Memories 💕</h2>
  <div class="gallery">
    <img src="photo1.jpg">
    <img src="photo2.jpg">
  </div>
  <button class="nextBtn" onclick="goNext(event)">Next →</button>
</div>

<!-- SCREEN 4 -->
<div class="screen" id="screen4">
  <button onclick="unlockSecret(event)">Unlock Secret 💌</button>
  <p id="secretText"></p>
  <button class="nextBtn" onclick="goNext(event)">Next →</button>
</div>

<!-- SCREEN 5 -->
<div class="screen" id="screen5">
  <h1 class="glow">Will you be mine forever? 💍</h1>
  <button class="yes" onclick="yesClicked(event)">YES ❤️</button>
  <button class="no" onmouseover="moveNo()">NO 😜</button>
</div>

<!-- SCREEN 6 -->
<div class="screen" id="screen6">
  <h1 class="glow">I Love You So Much 💖</h1>
</div>

<audio id="music" src="song.mp3"></audio>

<script src="script.js"></script>

</body>
</html>
