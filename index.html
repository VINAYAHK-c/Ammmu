<!DOCTYPE html>
<html>
<head>
  <title>For You ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="overlay"></div>
<canvas id="confetti"></canvas>

<!-- MUSIC -->
<audio id="music" src="vidssave.com Ennamo yedho song lyrics 48KBPS.mp3"></audio>

<!-- SCREEN 1 -->
<div class="screen active" id="screen1">
  <h1 class="title">Hey Ammuu ❤️</h1>
  <button onclick="startExperience()">Start 💫</button>
</div>

<!-- SCREEN 2 -->
<div class="screen" id="screen2">
  <h1 id="typing"></h1>
  <button onclick="goNext()">Next →</button>
</div>

<!-- SCREEN 3 -->
<div class="screen" id="screen3">
  <h2>Our Memories 💕</h2>
  <img src="WhatsApp Image 2026-09-11 at 7.15.10 PM.jpeg">
 
  <button onclick="goNext()">Next →</button>
</div>

<!-- SCREEN 4 -->
<div class="screen" id="screen4">
  <button onclick="unlockSecret()">Unlock Secret 💌</button>
  <p id="secretText"></p>
  <button onclick="goNext()">Next →</button>
</div>

<!-- SCREEN 5 (SHOCK) -->
<div class="screen" id="screen5">
  <h1 class="big">Wait...</h1>
</div>

<!-- SCREEN 6 (PROPOSAL) -->
<div class="screen" id="screen6">
  <h1>Will you stay with me forever? 💍</h1>
  <button class="yes" onclick="yesClicked()">YES ❤️</button>
  <button class="no" onmouseover="moveNo()">NO 😜</button>
</div>

<!-- SCREEN 7 (FINAL) -->
<div class="screen" id="screen7">
  <h1 class="final">
    I don’t need the world…<br>
    I just need you ❤️
  </h1>
</div>

<script src="script.js"></script>
</body>
</html>
